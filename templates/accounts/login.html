{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Log in — InspectIQ{% endblock %}

{% block content %}
<div class="iq-form-column">
    <h1>Log in</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button "Log in" button_type="submit" button_class="btn-primary" %}
    </form>
    <p class="mt-3">
        No account yet?
        <a href="{% url 'accounts:register' %}">Register</a>.
    </p>
</div>
{% endblock %}
