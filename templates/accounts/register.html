{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Register — InspectIQ{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">Register</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {% bootstrap_form form %}
            {% bootstrap_button "Create account" button_type="submit" button_class="btn-primary" %}
        </form>
    </div>
</div>
{% endblock %}
