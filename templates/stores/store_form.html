{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Add store — InspectIQ{% endblock %}

{% block content %}
<div class="iq-form-column">
    <h1>Add store</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button "Add store" button_type="submit" button_class="btn-primary" %}
        <a href="{% url 'stores:list' %}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}
